name: app_bora_trampar
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  google_fonts: ^8.2.1
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  brasil_fields: ^1.19.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  geolocator: ^13.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo-bora-trampar.jpeg"
  min_sdk_android: 21
