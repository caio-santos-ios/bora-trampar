<div class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-logo-large">
          <i class="fa-solid fa-key"></i>
        </div>
        <h1 class="auth-title">Recuperar <span class="gold-text">Senha</span></h1>
        <p class="auth-subtitle">Enviaremos as instruções de redefinição de acesso</p>
      </div>

      <div *ngIf="isSubmitted" class="success-box">
        <i class="fa-solid fa-circle-check success-icon"></i>
        <h3>E-mail enviado!</h3>
        <p>Verifique sua caixa de entrada para {{ email }} e siga as orientações.</p>
        <a routerLink="/login" class="btn-primary btn-submit" style="margin-top: 16px; text-decoration: none;">
          Voltar ao Login
        </a>
      </div>

      <form *ngIf="!isSubmitted" (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group">
          <label for="email">E-mail Cadastrado</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="admin@boratrampar.com"
            [(ngModel)]="email"
            name="email"
            required
          />
        </div>

        <button type="submit" class="btn-primary btn-submit" [disabled]="isLoading">
          <i class="fa-solid fa-paper-plane" *ngIf="!isLoading"></i>
          <i class="fa-solid fa-spinner fa-spin" *ngIf="isLoading"></i>
          <span>{{ isLoading ? 'Enviando...' : 'Enviar Link de Recuperação' }}</span>
        </button>

        <div class="back-login-row">
          <a routerLink="/login" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao Login
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
