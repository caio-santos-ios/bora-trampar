<div class="sidebar-wrapper" [class.open]="isOpen">
  <div class="sidebar-header">
    <div class="brand-container">
      <img src="assets/logo-bora-trampar.jpeg" alt="Bora Trampar" class="brand-logo-img" />
      <div class="brand-text">
        <span class="brand-title">BORA <span class="gold-text">TRAMPAR</span></span>
        <span class="brand-badge">ADMIN</span>
      </div>
    </div>
    <button class="btn-close-sidebar" (click)="closeSidebar.emit()">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <div class="sidebar-menu">
    <div class="menu-section-label">OPERACIONAL</div>

    <a routerLink="/dashboard" routerLinkActive="active" (click)="onNavigate()" class="menu-item">
      <i class="fa-solid fa-chart-pie"></i>
      <span>Dashboard</span>
    </a>

    <a routerLink="/verifications" routerLinkActive="active" (click)="onNavigate()" class="menu-item">
      <i class="fa-solid fa-id-card"></i>
      <span>Verificações</span>
      <span class="menu-pill-badge">Doc</span>
    </a>

    <a routerLink="/appointments" routerLinkActive="active" (click)="onNavigate()" class="menu-item">
      <i class="fa-solid fa-calendar-check"></i>
      <span>Agendamentos</span>
    </a>

    <a routerLink="/disputes" routerLinkActive="active" (click)="onNavigate()" class="menu-item">
      <i class="fa-solid fa-shield-halved"></i>
      <span>Contestações</span>
    </a>

    <div class="menu-section-label">CATÁLOGO & DADOS</div>

    <a routerLink="/categories" routerLinkActive="active" (click)="onNavigate()" class="menu-item">
      <i class="fa-solid fa-layer-group"></i>
      <span>Categorias</span>
    </a>

    <a routerLink="/services" routerLinkActive="active" (click)="onNavigate()" class="menu-item">
      <i class="fa-solid fa-briefcase"></i>
      <span>Serviços</span>
    </a>

    <a routerLink="/users" routerLinkActive="active" (click)="onNavigate()" class="menu-item">
      <i class="fa-solid fa-users"></i>
      <span>Usuários</span>
    </a>

    <div class="menu-section-label">FINANCEIRO & SISTEMA</div>

    <a routerLink="/payments" routerLinkActive="active" (click)="onNavigate()" class="menu-item">
      <i class="fa-solid fa-money-bill-wave"></i>
      <span>Financeiro & Pix</span>
    </a>

    <a routerLink="/settings" routerLinkActive="active" (click)="onNavigate()" class="menu-item">
      <i class="fa-solid fa-gear"></i>
      <span>Configurações</span>
    </a>
  </div>

  <div class="sidebar-footer">
    <button class="theme-toggle-btn" (click)="toggleTheme()">
      <i class="fa-solid" [ngClass]="currentTheme === 'dark' ? 'fa-sun' : 'fa-moon'"></i>
      <span>{{ currentTheme === 'dark' ? 'Modo Claro' : 'Modo Escuro' }}</span>
    </button>

    <div class="user-profile-bar">
      <div class="avatar-circle">
        {{ (user?.name || 'Admin')[0].toUpperCase() }}
      </div>
      <div class="user-info">
        <span class="user-name">{{ user?.name || 'Administrador' }}</span>
        <span class="user-role">Super Admin</span>
      </div>
      <button class="btn-logout" (click)="logout()" title="Sair do painel">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
      </button>
    </div>
  </div>
</div>
