<aside class="sidebar">
  <div class="sidebar-header" style="display: flex; justify-content: center; align-items: center;">
    <img src="assets/logo-bora-trampar.jpeg" alt="Bora Trampar Logo" style="max-height: 48px; max-width: 100%; object-fit: contain; border-radius: 8px;" />
  </div>
  
  <nav class="sidebar-nav">
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
      <i class="fa-solid fa-chart-pie nav-icon"></i>
      <span>Dashboard</span>
    </a>
    <a routerLink="/verifications" routerLinkActive="active" class="nav-item">
      <i class="fa-solid fa-id-card nav-icon"></i>
      <span>Verificações</span>
    </a>
    <a routerLink="/appointments" routerLinkActive="active" class="nav-item">
      <i class="fa-regular fa-calendar-check nav-icon"></i>
      <span>Agendamentos</span>
    </a>
    <a routerLink="/disputes" routerLinkActive="active" class="nav-item">
      <i class="fa-solid fa-shield-halved nav-icon"></i>
      <span>Contestações</span>
    </a>
    <a routerLink="/categories" routerLinkActive="active" class="nav-item">
      <i class="fa-solid fa-layer-group nav-icon"></i>
      <span>Categorias</span>
    </a>
    <a routerLink="/services" routerLinkActive="active" class="nav-item">
      <i class="fa-solid fa-briefcase nav-icon"></i>
      <span>Serviços</span>
    </a>
    <a routerLink="/users" routerLinkActive="active" class="nav-item">
      <i class="fa-solid fa-users nav-icon"></i>
      <span>Usuários</span>
    </a>
    <a routerLink="/payments" routerLinkActive="active" class="nav-item">
      <i class="fa-solid fa-money-bill-wave nav-icon"></i>
      <span>Financeiro</span>
    </a>
    <a routerLink="/settings" routerLinkActive="active" class="nav-item">
      <i class="fa-solid fa-gear nav-icon"></i>
      <span>Configurações</span>
    </a>
    <a href="https://wa.me/5511965079106?text=Ol%C3%A1%2C%20preciso%20de%20suporte%20no%20sistema%20Bora%20Trampar" target="_blank" rel="noopener noreferrer" class="nav-item" style="color: #25d366; display: flex; align-items: center; gap: 10px;">
      <i class="fa-brands fa-whatsapp nav-icon" style="font-size: 16px;"></i>
      <span>Suporte WhatsApp</span>
    </a>
    <button (click)="themeService.toggleTheme()" class="nav-item" style="background: none; border: none; width: 100%; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px; color: var(--text-sidebar-muted);">
      <i class="fa-solid nav-icon" [ngClass]="themeService.isDark() ? 'fa-sun' : 'fa-moon'" style="font-size: 14px; width: 16px; text-align: center;"></i>
      <span>{{ themeService.isDark() ? 'Modo Claro' : 'Modo Escuro' }}</span>
    </button>
    <a (click)="logout()" class="nav-item logout-btn" style="cursor: pointer; margin-top: auto; margin-bottom: 1rem; color: #ff4d4f; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <i class="fa-solid fa-arrow-right-from-bracket"></i>
      <span>Sair</span>
    </a>
  </nav>
</aside>
